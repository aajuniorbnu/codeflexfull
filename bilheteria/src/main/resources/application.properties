spring.application.name=codeflex-bilheteria
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/codeflex_bilheteria}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.property-naming-strategy=SNAKE_CASE
springdoc.swagger-ui.path=/docs
pagamentos.url=${PAGAMENTOS_URL:http://localhost:8081}
admin.token=${ADMIN_TOKEN:}
tmdb.token=${TMDB_API_TOKEN:}
tmdb.key=${TMDB_API_KEY:}
tmdb.url=${TMDB_URL:https://api.themoviedb.org/3}
app.demo=${DEMO_MODE:true}
spring.jackson.time-zone=America/Sao_Paulo
