services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-admin}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - codeflex-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
  bilheteria:
    build:
      context: .
      args: { SERVICE: bilheteria }
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/codeflex_bilheteria
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-admin}
      PAGAMENTOS_URL: http://pagamentos:8081
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Configure ADMIN_TOKEN no arquivo .env}
      DEMO_MODE: ${DEMO_MODE:-true}
      TZ: America/Sao_Paulo
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
  pagamentos:
    build:
      context: .
      args: { SERVICE: pagamentos }
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/codeflex_pagamentos
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-admin}
      BILHETERIA_URL: http://bilheteria:8080
      TZ: America/Sao_Paulo
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on: [bilheteria]
volumes:
  codeflex-data:
