spring.application.name=codeplax-pagamentos-api

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/codeflex_pagamentos}
server.port=${SERVER_PORT:8081}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operations-sorter=method

spring.jackson.property-naming-strategy=SNAKE_CASE
# Configure o endereço da máquina do time de Bilheteria no IntelliJ.
bilheteria.url=${BILHETERIA_URL:http://localhost:8080}
